[workspace]
resolver = "3"
members = ["crates/*", "src-tauri"]
default-members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/exomo/notula"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.dependencies]
notula-model = { path = "crates/notula-model" }
notula-layout = { path = "crates/notula-layout" }
notula-format = { path = "crates/notula-format" }
notula-playback = { path = "crates/notula-playback" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
roxmltree = "0.21"
thiserror = "2"
cpal = "0.15"
rustysynth = "1.3"
