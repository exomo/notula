[package]
name = "notula-app"
description = "Notula desktop application"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[lib]
name = "notula_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
notula-model.workspace = true
notula-layout.workspace = true
notula-format.workspace = true
notula-playback.workspace = true
serde.workspace = true
cpal.workspace = true
rustysynth.workspace = true
manguebyte-sampler = "0.1"
manguebyte-core = "0.1"
manguebyte-dsp = "0.1"
tauri-plugin-dialog = "2"
base64 = "0.22"
resvg = { version = "0.45", default-features = false, features = ["text"] }
svg2pdf = "0.13"
